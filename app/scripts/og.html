<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Nunito:wght@700;800;900&family=Rye&display=block">
<style>
:root{--brand:#3446c9;--deep:#222e8e;--gold:#d99a06;--gold-soft:#fbefd0;--olive:#4b8a2a;--olive-soft:#e3f1d8;--ink:#161a3a;--muted:#5d6286;--line:#e0e2ec;--m-shell:#c99a5e;--m-band:#9a6c38;--m-skin:#e8c79c;--m-ink:#3a2a18}
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#f6f6f2;font-family:Nunito,sans-serif;color:var(--ink);position:relative}
.bg{position:absolute;inset:0;font-family:"GFS Didot",serif;color:#e7e8f1;font-size:150px;line-height:1;letter-spacing:40px;padding:10px 0 0 30px;word-break:break-all}
.left{position:absolute;left:72px;top:70px;width:560px}
.wm{font-family:Rye,serif;font-size:96px;color:var(--brand);line-height:1}
.gr{font-family:"GFS Didot",serif;font-size:44px;color:var(--gold);margin-top:6px}
h1{font-size:58px;line-height:1.05;margin:34px 0 14px;font-weight:900}
p{font-size:26px;font-weight:800;color:var(--muted);margin:0;line-height:1.3}
.card{position:absolute;right:70px;top:78px;width:430px;background:#fff;border:2px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 10px 0 var(--line)}
.lab{font-size:15px;font-weight:900;letter-spacing:.1em;color:var(--brand);text-transform:uppercase}
.q{font-size:32px;font-weight:900;margin:8px 0 2px}.q span{color:var(--brand)}
.g{font-family:"GFS Didot",serif;font-size:28px;color:var(--muted)}
.opt{margin-top:12px;padding:14px 16px;border-radius:16px;border:3px solid var(--line);font-size:22px;font-weight:800;box-shadow:0 4px 0 var(--line)}
.opt.ok{border-color:var(--olive);background:var(--olive-soft);box-shadow:0 4px 0 var(--olive)}
.xp{position:absolute;right:28px;top:22px;background:var(--gold);color:#1d1500;font-weight:900;font-size:20px;padding:6px 14px;border-radius:999px;box-shadow:0 4px 0 #a87402}
.m{position:absolute;left:470px;bottom:28px;width:210px}
.url{position:absolute;left:72px;bottom:48px;font-size:24px;font-weight:900;color:var(--brand)}
</style></head><body>
